  <style>
    :root {
      color-scheme: light;
      --ink: #12343b;
      --muted: #557178;
      --navy: #0c4a5a;
      --navy-dark: #083542;
      --teal: #dff5f2;
      --yellow: #ffd166;
      --yellow-dark: #9a6500;
      --card: #ffffff;
      --line: #cfe4e5;
      --shadow: 0 10px 25px rgba(12, 74, 90, .08);
      --highlight-bg: #fffde7;
      --highlight-border: #f59e0b;
      --primary-accent: #0f766e;
      --primary-hover: #115e59;
      --selected-bg: #e0f2fe;
      --selected-border: #0284c7;
      --selected-text: #0369a1;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: #eef8f8;
      color: var(--ink);

      font-size: 19px;

    button:focus-visible, select:focus-visible {
      outline: 4px solid #f4ad38;
      outline-offset: 2px;
    }

    /* 頂部控制列 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 53, 66, .98);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: white;
      box-shadow: 0 3px 16px rgba(0, 0, 0, .18);
    }

    .topbar-inner {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--yellow);
      color: var(--navy-dark);
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      font-weight: 800;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-home:hover { background: rgba(255, 255, 255, 0.28); }

    .engine-toggle-group {
      display: inline-flex;
      background: rgba(0, 0, 0, .3);
      padding: 3px;
      border-radius: 99px;
      gap: 2px;
    }

    .engine-btn {
      border: none;
      background: transparent;
      padding: 5px 11px;
      font-size: .82rem;
      font-weight: 800;
      color: #cfe4e5;
      border-radius: 99px;
      transition: all .2s;
    }

    .engine-btn.active {
      background: var(--yellow);
      color: var(--navy-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tool-btn {
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: white;
      padding: 5px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: .88rem;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .4);
    }
    .tool-btn.active {
      background: #f43f5e;
      border-color: #f43f5e;
      color: white;
    }

    .speed-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .85rem;
      background: rgba(255, 255, 255, .08);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .speed-wrapper select {
      background: transparent;
      border: none;
      color: var(--yellow);
      font-weight: 800;
      font-size: .9rem;
      cursor: pointer;
    }

      color: white;
    }

    .container {
      width: min(960px, 94%);

    .intro-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 22px;
      border: 2px solid var(--line);
      box-shadow: var(--shadow);
    }

    .intro-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 800;
    }

    .intro-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--navy);
      margin: 0;
    }

    .intro-desc {
      margin: 8px 0 0;
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .btn-listen-intro {
      background: var(--primary-accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 800;
      font-size: .9rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .2s;
    }
    .btn-listen-intro:hover { background: var(--primary-hover); }

    /* 即時語音狀態條 */
    .status-banner {
      background: #042f2e;
      color: #5eead4;
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: .95rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);

    .status-pill-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .status-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2dd4bf;
      display: inline-block;
      box-shadow: 0 0 8px #2dd4bf;
    }

    .progress-pill {
      background: rgba(255, 255, 255, .15);
      padding: 3px 12px;
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 800;
      color: white;

    /* 題號快速跳題導覽列 */
    .q-nav-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    .q-nav-btn {
      flex: 1 1 36px;
      min-width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      font-weight: 800;
      font-size: 1rem;
      transition: all .2s;

    .q-nav-btn:hover {
      background: var(--teal);
      border-color: var(--primary-accent);
    }
    .q-nav-btn.done {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }

    /* 題目卡片 */
    .question-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px 26px;
      margin-bottom: 22px;
      border: 2px solid var(--line);
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }

    .question-card.speaking {
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .25);
    }

    .question-card.answered {
      border-color: #93c5fd;
    }

    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .head-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .question-badge {
      background: var(--navy);
      color: white;
      font-size: .95rem;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 99px;
      letter-spacing: .02em;
    }

    .user-feedback {
      font-size: .92rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 8px;
      display: none;
    }
    .user-feedback.active {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .listen-btn {
      background: #0f766e;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 800;
      font-size: .92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .2s, transform .1s;
    }
    .listen-btn:hover { background: #115e59; }
    .listen-btn:active { transform: scale(0.97); }
    .listen-btn.speaking {
      background: #f59e0b;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* 題幹句子 */
    .question-sentence {
      font-size: 1.25rem;
      line-height: 1.8;
      font-weight: 600;
      margin: 10px 0 16px;
      color: #0f172a;
    }

    .bracket-pill {
      display: inline-block;
      min-width: 38px;
      text-align: center;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      border-bottom: 2px solid #0284c7;
      border-radius: 6px;
      padding: 0 4px;
      margin: 0 2px;
      transition: all .2s;
    }

    .blank-pill {
      display: inline-block;
      padding: 2px 10px;
      margin: 0 4px;
      border-bottom: 3px solid #0f766e;
      background: #f0fdf4;
      color: #0f766e;
      font-weight: 800;
      border-radius: 6px;
      transition: all .2s;
    }

    .blank-pill.filled {
      background: #fef3c7;
      border-bottom-color: #d97706;
      color: #92400e;
    }

    /* 選項網格 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      transition: all .18s ease;
      cursor: pointer;
    }

    .option-btn:hover {
      border-color: #0f766e;
      background: #f0fdf4;
      transform: translateY(-2px);
    }

    .option-btn.selected {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      box-shadow: 0 4px 12px rgba(2, 132, 199, .2);
    }

    .option-btn.speaking {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #e2e8f0;
      color: #334155;
      display: grid;
      place-items: center;
      font-size: .95rem;
      font-weight: 800;
      flex-shrink: 0;
      transition: all .18s;
    }

    .option-btn.selected .option-letter {
      background: #0284c7;
      color: white;
    }

    .option-btn.speaking .option-letter {
      background: #f59e0b;
      color: white;
    }

    .option-text {
      flex: 1;
      line-height: 1.3;
    }

    .option-sound-icon {
      font-size: .85rem;
      opacity: 0.6;
    }
    .option-btn:hover .option-sound-icon { opacity: 1; }

    /* 單題清除按鈕 */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }

    .btn-clear-q {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all .2s;
    }
    .btn-clear-q:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* 列印樣式 (純淨學習單，無操作干擾按鈕) */
    @media print {
      .topbar, .status-banner, .q-nav-bar, .listen-btn, .card-footer, .btn-listen-intro, .option-sound-icon {
        display: none !important;
      }
      body {
        background: white !important;
        font-size: 15pt !important;
      }
      .container {
        width: 100% !important;
        margin: 0 !important;
      }
      .intro-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 0 15px 0 !important;
        border-bottom: 2px solid #000 !important;
      }
      .question-card {
        page-break-inside: avoid;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        margin-bottom: 15px !important;
        padding: 12px 16px !important;
      }
      .option-btn {
        border: 1px solid #999 !important;
        background: white !important;
        color: black !important;
        box-shadow: none !important;
      }
      .bracket-pill, .blank-pill {
        background: transparent !important;
        border-bottom: 1px solid black !important;
        color: black !important;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部控制面板 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a class="btn-home" href="../index.html">← 首頁</a>
        <div class="brand">
          <div class="brand-mark">🎧</div>
          <h1>《吃冰的滋味》生字語詞－挖空選擇題</h1>
        </div>
      </div>

      <!-- 控制按鈕區 -->
      <div class="toolbar">
        <div class="engine-toggle-group" title="選擇朗讀語音來源">
          <button class="engine-btn" id="engineNative" type="button" onclick="switchEngine('native')">📱 平板原生</button>
          <button class="engine-btn active" id="engineMp3" type="button" onclick="switchEngine('mp3')">☁️ 微軟真人</button>

            <option value="1.0">1.0x</option>
            <option value="1.15">1.15x</option>
          </select>
        </div>

        <button class="tool-btn" type="button" onclick="testVoiceAudio()" title="測試喇叭是否有聲音">
          🔔 測聲音
        </button>

        <button class="tool-btn" id="btnPlayAll" type="button" onclick="togglePlayAllQuestions()" title="自動依序唸出所有題目">
          ▶ 播全部
        </button>

        <button class="tool-btn" type="button" onclick="stopAllSpeech()" title="立即停止正在朗讀的聲音">
          ⏹ 停止
        </button>

        <button class="tool-btn" type="button" onclick="resetAllAnswers()" title="清除所有答案重新練習">
          ↺ 重新作答
        </button>

        <button class="tool-btn" type="button" onclick="window.print()" title="列印純淨白紙學習單">
          🖨️ 列印
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 說明橫幅卡片 -->
    <section class="intro-card">
      <div class="intro-header">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <h2 class="intro-title">練習題－第一大題：生字語詞－句子（挖空選擇題）</h2>
          <span class="intro-badge">✨ 純淨學生練習版</span>
        </div>
        <button class="btn-listen-intro" type="button" onclick="playIntroAudio()">
          🔊 聽大題說明
        </button>
      </div>
      <p class="intro-desc">
        請選出最適合填入句子空格中的語詞。點擊「<strong>🔊 聽題目</strong>」可單獨聽題目句（遇空格自動唸「空格」不劇透）；點擊各選項可<strong>單獨聽發音</strong>並填入答案，零劇透自主練習！
      </p>

    <!-- 即時狀態與進度列 -->
    <div class="status-banner">
      <div class="status-pill-text">

        <span id="audioStatusText">語音就緒，點選題目或選項即可發音</span>

      <div class="progress-pill" id="progressPill">

    <!-- 快速跳題導覽列 -->

    <section id="quizList"></section>

  </main>

  <!-- 隱藏式全域音訊播放器 -->
  <audio id="globalPlayer" preload="auto" style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;"></audio>

  <script>

    const questions = [

          { "letter": "D", "text": "垂涎三尺", "audio": "q01-optD.mp3", "spoken": "選項D，垂涎三尺。" }

      {

        "audio": "q02-question.mp3",
        "spoken": "第2題。新開的甜點店裡有空格的蛋糕，每一種看起來都很美味。",
        "options": [
          { "letter": "A", "text": "五花八門", "audio": "q02-optA.mp3", "spoken": "選項A，五花八門。" },
          { "letter": "B", "text": "遜色", "audio": "q02-optB.mp3", "spoken": "選項B，遜色。" },
          { "letter": "C", "text": "俄頃", "audio": "q02-optC.mp3", "spoken": "選項C，俄頃。" },
          { "letter": "D", "text": "消失殆盡", "audio": "q02-optD.mp3", "spoken": "選項D，消失殆盡。" }
        ]
      },
      {
        "id": 3,
        "prefix": "3. 弟弟一看到桌上剛烤好的披薩，忍不住",
        "suffix": "，想要立刻咬一口。",
        "audio": "q03-question.mp3",

        "options": [
          { "letter": "A", "text": "俄頃", "audio": "q04-optA.mp3", "spoken": "選項A，俄頃。" },
          { "letter": "B", "text": "遜色", "audio": "q04-optB.mp3", "spoken": "選項B，遜色。" },
          { "letter": "C", "text": "貨真價實", "audio": "q04-optC.mp3", "spoken": "選項C，貨真價實。" },

      {

        "prefix": "5. 老闆飛快地操作刨冰機，冰花如雪飛落，",

        "audio": "q05-question.mp3",
        "spoken": "第5題。老闆飛快地操作刨冰機，冰花如雪飛落，空格就堆滿了整盤。",
        "options": [
          { "letter": "A", "text": "俄頃", "audio": "q05-optA.mp3", "spoken": "選項A，俄頃。" },
          { "letter": "B", "text": "遜色", "audio": "q05-optB.mp3", "spoken": "選項B，遜色。" },
          { "letter": "C", "text": "黯然失色", "audio": "q05-optC.mp3", "spoken": "選項C，黯然失色。" },
          { "letter": "D", "text": "名聞遐邇", "audio": "q05-optD.mp3", "spoken": "選項D，名聞遐邇。" }
        ]
      },
      {

        "prefix": "6. 由於環境受到破壞，森林裡的珍貴植物已經",

        "audio": "q06-question.mp3",
        "spoken": "第6題。由於環境受到破壞，森林裡的珍貴植物已經空格。",
        "options": [
          { "letter": "A", "text": "名聞遐邇", "audio": "q06-optA.mp3", "spoken": "選項A，名聞遐邇。" },
          { "letter": "B", "text": "五花八門", "audio": "q06-optB.mp3", "spoken": "選項B，五花八門。" },
          { "letter": "C", "text": "消失殆盡", "audio": "q06-optC.mp3", "spoken": "選項C，消失殆盡。" },
          { "letter": "D", "text": "垂涎三尺", "audio": "q06-optD.mp3", "spoken": "選項D，垂涎三尺。" }
        ]
      },
      {
        "id": 7,
        "prefix": "7. 如果舞台上的主角沒有燈光照射，他的表演可能就會",
        "suffix": "。",
        "audio": "q07-question.mp3",
        "spoken": "第7題。如果舞台上的主角沒有燈光照射，他的表演可能就會空格。",
        "options": [
          { "letter": "A", "text": "黯然失色", "audio": "q07-optA.mp3", "spoken": "選項A，黯然失色。" },
          { "letter": "B", "text": "貨真價實", "audio": "q07-optB.mp3", "spoken": "選項B，貨真價實。" },
          { "letter": "C", "text": "名聞遐邇", "audio": "q07-optC.mp3", "spoken": "選項C，名聞遐邇。" },
          { "letter": "D", "text": "俄頃", "audio": "q07-optD.mp3", "spoken": "選項D，俄頃。" }
        ]
      },
      {
        "id": 8,
        "prefix": "8. 雖然這件衣服的包裝很精美，但就質料而言，其實比舊的還",
        "suffix": "。",
        "audio": "q08-question.mp3",
        "spoken": "第8題。雖然這件衣服的包裝很精美，但就質料而言，其實比舊的還空格。",
        "options": [
          { "letter": "A", "text": "貨真價實", "audio": "q08-optA.mp3", "spoken": "選項A，貨真價實。" },
          { "letter": "B", "text": "遜色", "audio": "q08-optB.mp3", "spoken": "選項B，遜色。" },
          { "letter": "C", "text": "名聞遐邇", "audio": "q08-optC.mp3", "spoken": "選項C，名聞遐邇。" },
          { "letter": "D", "text": "五花八門", "audio": "q08-optD.mp3", "spoken": "選項D，五花八門。" }
        ]
      }
    ];

    const AUDIO_BASE_DIR = 'audio/eating-ice-vocab-fill-quiz/';
    let currentEngine = localStorage.getItem('voice_hub_engine') || 'mp3';
    let currentPlaybackRate = 0.9;
    let isPlayingAll = false;
    let playAllIndex = 0;
    let userAnswers = {}; // { [qId]: { letter: 'A', text: '俄頃' } }

    const player = document.getElementById('globalPlayer');
    const synth = window.speechSynthesis;
    let currentSpeakingElement = null;

    // 初始化渲染
    function initUI() {
      // 1. 渲染快速跳題按鈕
      const navBar = document.getElementById('qNavBar');
      navBar.innerHTML = questions.map(q => `
        <button class="q-nav-btn" id="nav-${q.id}" type="button" onclick="scrollToQuestion(${q.id})" title="跳至第 ${q.id} 題">
          ${q.id}
        </button>
      `).join('');

      // 2. 渲染題目卡片
      const quizList = document.getElementById('quizList');
      quizList.innerHTML = questions.map(q => `
        <article class="question-card" id="card-${q.id}">
          <div class="question-head">
            <div class="head-left">
              <span class="question-badge">第 ${q.id} 題</span>
              <span class="user-feedback" id="feedback-${q.id}"></span>
            </div>
            <button class="listen-btn" id="btn-listen-q${q.id}" type="button" onclick="playQuestionSpeech(${q.id}, this)">
              🔊 聽題目
            </button>
          </div>

          <p class="question-sentence">
            ( <span class="bracket-pill" id="bracket-${q.id}">　</span> )
            ${q.prefix}
            <span class="blank-pill" id="blank-${q.id}">＿＿＿＿＿＿</span>
            ${q.suffix}
          </p>

          <div class="options-grid">
            ${q.options.map(opt => `
              <button 
                class="option-btn" 
                id="btn-q${q.id}-opt${opt.letter}" 
                type="button" 
                onclick="chooseOption(${q.id}, '${opt.letter}', '${opt.text}', '${opt.audio}', '${opt.spoken}', this)"
              >
                <span class="option-letter">${opt.letter}</span>
                <span class="option-text">${opt.text}</span>
                <span class="option-sound-icon">🔊</span>
              </button>
            `).join('')}
          </div>

          <div class="card-footer">
            <button class="btn-clear-q" type="button" onclick="clearQuestion(${q.id})">
              ↺ 清除此題
            </button>
          </div>
        </article>
      `).join('');

      updateEngineUI();
      updateProgress();
    }

    // 捲動至特定題目
    function scrollToQuestion(qId) {
      const card = document.getElementById(`card-${qId}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // 學生點選選項（獨立點讀發音並填入答案，零劇透答案）
    function chooseOption(qId, letter, text, audioFile, spokenText, buttonEl) {
      userAnswers[qId] = { letter, text };

      // 更新括號與空格顯示
      const bracketEl = document.getElementById(`bracket-${qId}`);
      const blankEl = document.getElementById(`blank-${qId}`);
      const fbEl = document.getElementById(`feedback-${qId}`);
      const cardEl = document.getElementById(`card-${qId}`);

      if (bracketEl) bracketEl.textContent = letter;
      if (blankEl) {
        blankEl.textContent = text;
        blankEl.classList.add('filled');
      }
      if (fbEl) {
        fbEl.textContent = `已選：(${letter}) ${text}`;
        fbEl.classList.add('active');
      }
      if (cardEl) {
        cardEl.classList.add('answered');
      }

      // 更新選項按鈕選中外觀
      const q = questions.find(item => item.id === qId);
      if (q) {
        q.options.forEach(opt => {
          const btn = document.getElementById(`btn-q${qId}-opt${opt.letter}`);
          if (btn) {
            btn.classList.toggle('selected', opt.letter === letter);
          }
        });
      }

      updateProgress();
      setStatus(`第 ${qId} 題已選擇：(${letter}) ${text}`);

      // 播放該選項獨立語音
      playAudio(audioFile, spokenText, buttonEl);
    }

    // 點擊聽題目（遇到空格讀「空格」，不劇透答案）
    function playQuestionSpeech(qId, buttonEl) {
      const q = questions.find(item => item.id === qId);
      if (!q) return;
      setStatus(`正在朗讀第 ${qId} 題題目...`);
      playAudio(q.audio, q.spoken, buttonEl);
    }

    // 聽大題說明
    function playIntroAudio() {
      setStatus('正在播放：大題說明');
      playAudio('intro.mp3', '第一大題：生字語詞，句子挖空選擇題。請選出最適合填入句子空格中的語詞。', null);
    }

    // 測試發音按鈕
    function testVoiceAudio() {
      setStatus('正在測試發音...');
      playAudio('test-sound.mp3', '語音測試正常，歡迎使用生字語詞挖空選擇題聽讀練習。', null);
    }

    // 清除單題選擇
    function clearQuestion(qId) {
      delete userAnswers[qId];
      const bracketEl = document.getElementById(`bracket-${qId}`);
      const blankEl = document.getElementById(`blank-${qId}`);
      const fbEl = document.getElementById(`feedback-${qId}`);
      const cardEl = document.getElementById(`card-${qId}`);

      if (bracketEl) bracketEl.textContent = '　';
      if (blankEl) {
        blankEl.textContent = '＿＿＿＿＿＿';
        blankEl.classList.remove('filled');
      }
      if (fbEl) {
        fbEl.textContent = '';
        fbEl.classList.remove('active');
      }
      if (cardEl) {
        cardEl.classList.remove('answered');
      }

      const q = questions.find(item => item.id === qId);
      if (q) {
        q.options.forEach(opt => {
          const btn = document.getElementById(`btn-q${qId}-opt${opt.letter}`);
          if (btn) btn.classList.remove('selected');
        });
      }

      updateProgress();
      setStatus(`第 ${qId} 題已清除`);
    }

    // 重新作答所有題目
    function resetAllAnswers() {
      if (confirm('確定要清除所有已填寫的選項，重新練習嗎？')) {
        stopAllSpeech();
        questions.forEach(q => clearQuestion(q.id));
        setStatus('已重設所有題目');
      }
    }

    // 更新進度與導覽列
    function updateProgress() {
      const doneCount = Object.keys(userAnswers).length;
      document.getElementById('progressPill').textContent = `已完成：${doneCount} / ${questions.length} 題`;

      questions.forEach(q => {
        const navBtn = document.getElementById(`nav-${q.id}`);
        if (navBtn) {
          if (userAnswers[q.id]) {
            navBtn.classList.add('done');
            navBtn.textContent = `✓${q.id}`;
          } else {
            navBtn.classList.remove('done');
            navBtn.textContent = `${q.id}`;
          }
        }
      });
    }

    // 切換語音引擎
    function switchEngine(engine) {
      stopAllSpeech();
      currentEngine = engine;
      localStorage.setItem('voice_hub_engine', engine);
      updateEngineUI();
      setStatus(engine === 'native' ? '已切換為平板原生語音' : '已切換為微軟真人語音');
    }

    function updateEngineUI() {
      document.getElementById('engineNative').classList.toggle('active', currentEngine === 'native');
      document.getElementById('engineMp3').classList.toggle('active', currentEngine === 'mp3');
    }

    function onSpeedChange(val) {
      currentPlaybackRate = parseFloat(val);
      if (player) player.playbackRate = currentPlaybackRate;
      setStatus(`已調整語速為 ${val}x`);
    }

    function setStatus(text) {
      document.getElementById('audioStatusText').textContent = text;
    }

    // 核心播放音訊函式
    function playAudio(filename, spokenText, element, onEndedCallback) {
      stopAllSpeech();

      if (element) {
        element.classList.add('speaking');
        currentSpeakingElement = element;
      }

      if (currentEngine === 'native') {
        speakNative(spokenText, element, onEndedCallback);
        return;
      }

      const fullUrl = AUDIO_BASE_DIR + filename;
      player.src = fullUrl;
      player.playbackRate = currentPlaybackRate;

      player.onended = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      player.onerror = (err) => {
        console.warn('MP3 load failed, fallback to native speech:', err);
        speakNative(spokenText, element, onEndedCallback);
      };

      player.play().catch(err => {
        console.warn('Playback blocked or failed, fallback to native:', err);
        speakNative(spokenText, element, onEndedCallback);
      });
    }

    // 平板原生發音
    function speakNative(text, element, onEndedCallback) {
      if (!synth) {
        if (onEndedCallback) onEndedCallback();
        return;
      }

      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW';
      u.rate = currentPlaybackRate;

      u.onend = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      u.onerror = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      synth.speak(u);
    }

    // 停止所有語音
    function stopAllSpeech() {
      if (player) {
        try {
          player.pause();
          player.currentTime = 0;
        } catch(e) {}
      }
      if (synth) {
        try { synth.cancel(); } catch(e) {}
      }
      document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
      currentSpeakingElement = null;
      isPlayingAll = false;
      const playAllBtn = document.getElementById('btnPlayAll');
      if (playAllBtn) {
        playAllBtn.classList.remove('active');
        playAllBtn.textContent = '▶ 播全部';
      }
    }

    // 循序播放全部題目
    function togglePlayAllQuestions() {
      if (isPlayingAll) {
        stopAllSpeech();
        return;
      }

      isPlayingAll = true;
      playAllIndex = 0;
      const playAllBtn = document.getElementById('btnPlayAll');
      if (playAllBtn) {
        playAllBtn.classList.add('active');
        playAllBtn.textContent = '⏹ 停止播放';
      }

      playNextQuestionInQueue();
    }

    function playNextQuestionInQueue() {
      if (!isPlayingAll || playAllIndex >= questions.length) {
        stopAllSpeech();
        setStatus('全部題目已播放完畢');
        return;
      }

      const q = questions[playAllIndex];
      const card = document.getElementById(`card-${q.id}`);
      const btn = document.getElementById(`btn-listen-q${q.id}`);

      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      setStatus(`播全部中：第 ${q.id} 題...`);
      playAudio(q.audio, q.spoken, btn, () => {
        playAllIndex++;
        setTimeout(() => {
          if (isPlayingAll) playNextQuestionInQueue();
        }, 900);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initUI();
    });
  </script>
