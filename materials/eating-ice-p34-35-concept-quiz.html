    const AUDIO_BASE_DIR = 'audio/eating-ice-p34-35-concept-quiz/';

    let currentPlaybackRate = 0.9;
    let isPlayingAll = false;
    let playAllIndex = 0;
    let userAnswers = {}; // { [qId]: { letter: 'A', text: '俄頃' } }

    const player = document.getElementById('globalPlayer');
    const synth = window.speechSynthesis;
    let currentSpeakingElement = null;

    // 初始化渲染
    function initUI() {
      // 1. 渲染快速跳題按鈕
      const navBar = document.getElementById('qNavBar');
      navBar.innerHTML = questions.map(q => `
        <button class="q-nav-btn" id="nav-${q.id}" type="button" onclick="scrollToQuestion(${q.id})" title="跳至第 ${q.id} 題">
          ${q.id}
        </button>
      `).join('');

      // 2. 渲染題目卡片
      const quizList = document.getElementById('quizList');
      quizList.innerHTML = questions.map(q => `
        <article class="question-card" id="card-${q.id}">
          <div class="question-head">
            <div class="head-left">
              <span class="question-badge">第 ${q.id} 題</span>
              <span class="user-feedback" id="feedback-${q.id}"></span>
            </div>
            <button class="listen-btn" id="btn-listen-q${q.id}" type="button" onclick="playQuestionSpeech(${q.id}, this)">
              🔊 聽題目
            </button>
          </div>

          <p class="question-sentence">
            ( <span class="bracket-pill" id="bracket-${q.id}">　</span> )
            ${q.id}. ${q.question}
          </p>

          ${q.hint ? `
            <div class="hint-box">
              <span class="hint-tag">提示</span>
              <span>${q.hint}</span>
            </div>
          ` : ''}

          <div class="options-grid">
            ${q.options.map(opt => `
              <button 
                class="option-btn" 
                id="btn-q${q.id}-opt${opt.letter}" 
                type="button" 
                onclick="chooseOption(${q.id}, '${opt.letter}', '${opt.text}', '${opt.audio}', '${opt.spoken}', this)"
              >
                <span class="option-letter">${opt.letter}</span>
                <span class="option-text">${opt.text}</span>
                <span class="option-sound-icon">🔊</span>
              </button>
            `).join('')}
          </div>

          <div class="card-footer">
            <button class="btn-clear-q" type="button" onclick="clearQuestion(${q.id})">
              ↺ 清除此題
            </button>
          </div>
        </article>
      `).join('');

      updateEngineUI();
      updateProgress();
    }

    // 捲動至特定題目
    function scrollToQuestion(qId) {
      const card = document.getElementById(`card-${qId}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // 學生點選選項（獨立點讀發音並填入答案，零劇透答案）
    function chooseOption(qId, letter, text, audioFile, spokenText, buttonEl) {
      userAnswers[qId] = { letter, text };

      // 更新括號與回饋標籤
      const bracketEl = document.getElementById(`bracket-${qId}`);
      const fbEl = document.getElementById(`feedback-${qId}`);
      const cardEl = document.getElementById(`card-${qId}`);

      if (bracketEl) bracketEl.textContent = letter;
      if (fbEl) {
        fbEl.textContent = `已選：(${letter}) ${text}`;
        fbEl.classList.add('active');
      }
      if (cardEl) {
        cardEl.classList.add('answered');
      }

      // 更新選項按鈕選中外觀
      const q = questions.find(item => item.id === qId);
      if (q) {
        q.options.forEach(opt => {
          const btn = document.getElementById(`btn-q${qId}-opt${opt.letter}`);
          if (btn) {
            btn.classList.toggle('selected', opt.letter === letter);
          }
        });
      }

      updateProgress();
      setStatus(`第 ${qId} 題已選擇：(${letter}) ${text}`);

      // 播放該選項獨立語音
      playAudio(audioFile, spokenText, buttonEl);
    }

    // 點擊聽題目（朗讀題幹與提示）
    function playQuestionSpeech(qId, buttonEl) {
      const q = questions.find(item => item.id === qId);
      if (!q) return;
      setStatus(`正在朗讀第 ${qId} 題題目...`);
      playAudio(q.audio, q.spoken, buttonEl);
    }

    // 聽大題說明
    function playIntroAudio() {
      setStatus('正在播放：大題說明');
      playAudio('intro.mp3', '第34、35頁。練習題第二大題：生字語詞，句子概念選擇題。請聽題目與選項，選出最符合句意概念的語詞。', null);
    }

    // 測試發音按鈕
    function testVoiceAudio() {
      setStatus('正在測試發音...');
      playAudio('test-sound.mp3', '語音測試正常，歡迎使用句子概念選擇題聽讀練習。', null);
    }

    // 清除單題選擇
    function clearQuestion(qId) {
      delete userAnswers[qId];
      const bracketEl = document.getElementById(`bracket-${qId}`);
      const fbEl = document.getElementById(`feedback-${qId}`);
      const cardEl = document.getElementById(`card-${qId}`);

      if (bracketEl) bracketEl.textContent = '　';
      if (fbEl) {
        fbEl.textContent = '';
        fbEl.classList.remove('active');
      }
      if (cardEl) {
        cardEl.classList.remove('answered');
      }

      const q = questions.find(item => item.id === qId);
      if (q) {
        q.options.forEach(opt => {
          const btn = document.getElementById(`btn-q${qId}-opt${opt.letter}`);
          if (btn) btn.classList.remove('selected');
        });
      }

      updateProgress();
      setStatus(`第 ${qId} 題已清除`);
    }

    // 重新作答所有題目
    function resetAllAnswers() {
      if (confirm('確定要清除所有已填寫的選項，重新練習嗎？')) {
        stopAllSpeech();
        questions.forEach(q => clearQuestion(q.id));
        setStatus('已重設所有題目');
      }
    }

    // 更新進度與導覽列
    function updateProgress() {
      const doneCount = Object.keys(userAnswers).length;
      document.getElementById('progressPill').textContent = `已完成：${doneCount} / ${questions.length} 題`;

      questions.forEach(q => {
        const navBtn = document.getElementById(`nav-${q.id}`);
        if (navBtn) {
          if (userAnswers[q.id]) {
            navBtn.classList.add('done');
            navBtn.textContent = `✓${q.id}`;
          } else {
            navBtn.classList.remove('done');
            navBtn.textContent = `${q.id}`;
          }
        }
      });
    }

    // 切換語音引擎
    function switchEngine(engine) {
      stopAllSpeech();
      currentEngine = engine;
      localStorage.setItem('voice_hub_engine', engine);
      updateEngineUI();
      setStatus(engine === 'native' ? '已切換為平板原生語音' : '已切換為微軟真人語音');
    }

    function updateEngineUI() {
      document.getElementById('engineNative').classList.toggle('active', currentEngine === 'native');
      document.getElementById('engineMp3').classList.toggle('active', currentEngine === 'mp3');
    }

    function onSpeedChange(val) {
      currentPlaybackRate = parseFloat(val);
      if (player) player.playbackRate = currentPlaybackRate;
      setStatus(`已調整語速為 ${val}x`);
    }

    function setStatus(text) {
      document.getElementById('audioStatusText').textContent = text;
    }

    // 核心播放音訊函式
    function playAudio(filename, spokenText, element, onEndedCallback) {
      stopAllSpeech();

      if (element) {
        element.classList.add('speaking');
        currentSpeakingElement = element;
      }

      if (currentEngine === 'native') {
        speakNative(spokenText, element, onEndedCallback);
        return;
      }

      const fullUrl = AUDIO_BASE_DIR + filename;
      player.src = fullUrl;
      player.playbackRate = currentPlaybackRate;

      player.onended = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      player.onerror = (err) => {
        console.warn('MP3 load failed, fallback to native speech:', err);
        speakNative(spokenText, element, onEndedCallback);
      };

      player.play().catch(err => {
        console.warn('Playback blocked or failed, fallback to native:', err);
        speakNative(spokenText, element, onEndedCallback);
      });
    }

    // 平板原生發音
    function speakNative(text, element, onEndedCallback) {
      if (!synth) {
        if (onEndedCallback) onEndedCallback();
        return;
      }

      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW';
      u.rate = currentPlaybackRate;

      u.onend = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      u.onerror = () => {
        if (element) element.classList.remove('speaking');
        currentSpeakingElement = null;
        if (onEndedCallback) onEndedCallback();
      };

      synth.speak(u);
    }

    // 停止所有語音
    function stopAllSpeech() {
      if (player) {
        try {
          player.pause();
          player.currentTime = 0;
        } catch(e) {}
      }
      if (synth) {
        try { synth.cancel(); } catch(e) {}
      }
      document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
      currentSpeakingElement = null;
      isPlayingAll = false;
      const playAllBtn = document.getElementById('btnPlayAll');
      if (playAllBtn) {
        playAllBtn.classList.remove('active');
        playAllBtn.textContent = '▶ 播全部';
      }
    }

    // 循序播放全部題目（包含題幹與選項）
    function togglePlayAllQuestions() {
      if (isPlayingAll) {
        stopAllSpeech();
        return;
      }

      isPlayingAll = true;
      playAllIndex = 0;
      const playAllBtn = document.getElementById('btnPlayAll');
      if (playAllBtn) {
        playAllBtn.classList.add('active');
        playAllBtn.textContent = '⏹ 停止播放';
      }

      playNextQuestionInQueue();
    }

    function playNextQuestionInQueue() {
      if (!isPlayingAll || playAllIndex >= questions.length) {
        stopAllSpeech();
        setStatus('全部題目已播放完畢');
        return;
      }

      const q = questions[playAllIndex];
      const card = document.getElementById(`card-${q.id}`);
      const btn = document.getElementById(`btn-listen-q${q.id}`);

      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      setStatus(`播全部中：第 ${q.id} 題 (含選項)...`);
      playAudio(q.fullAudio, q.fullSpoken, btn, () => {
        playAllIndex++;
        setTimeout(() => {
          if (isPlayingAll) playNextQuestionInQueue();
        }, 900);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initUI();
    });
  </script>
</body>
</html>
